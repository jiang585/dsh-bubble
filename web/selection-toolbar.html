<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSH Bubble 划词</title>
    <link rel="stylesheet" href="selection-toolbar.css">
  </head>
  <body>
    <div id="bar">
      <button id="search" type="button" class="tool-btn" title="在默认浏览器中搜索">
        <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="7" cy="7" r="4.5"></circle>
          <line x1="10.5" y1="10.5" x2="14" y2="14"></line>
        </svg>
        <span>搜索</span>
      </button>

      <div class="divider"></div>

      <button id="translate" type="button" class="tool-btn" title="快速翻译文本">
        <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="8" cy="8" r="6"></circle>
          <path d="M2 8h12M8 2a10 10 0 0 0 0 12M8 2a10 10 0 0 1 0 12"></path>
        </svg>
        <span>翻译</span>
      </button>

      <div class="divider"></div>

      <button id="send-to-agent" type="button" class="tool-btn highlight" title="将文本注入悬浮球会话">
        <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2.5l-7 7M14 2.5L9.5 14l-2.5-4.5L2.5 7z"></path>
        </svg>
        <span>发给 Agent</span>
      </button>

      <button id="close-toolbar" type="button" class="close-btn" title="关闭">×</button>
    </div>
    <script src="selection-toolbar.js"></script>
  </body>
</html>
