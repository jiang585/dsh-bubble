<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8">
    <title>Bubble panel probe</title>
  </head>
  <body>
    <!--
      Regression probe for three panel behaviours:

      1. a newly arrived message always scrolls the transcript to the tail;
      2. a prompt sent while the agent is busy is echoed immediately and retired once the durable
         transcript carries it;
      3. a pending `ask_user_question` is surfaced with its options and a jump to the DSH window.

      The real panel page is mounted in a same-origin iframe with a shim that fakes the Tauri bridge
      and the SSE stream, so the probe drives production code without a running DSH. `scripts/
      check-panel.mjs` runs this through headless Chromium and reads data-result from the dumped DOM.
    -->
    <div id="out" data-result="pending">running…</div>
    <iframe id="frame" width="344" height="444" style="border:1px solid #ccc"></iframe>
    <script>
      const out = document.getElementById('out')
      const log = []
      const say = (line) => { log.push(line); out.textContent = log.join('\n') }
      const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms))

      /** Build the shim installed before the panel's own scripts run. */
      function shim() {
        return `<base href="../"><script>
          window.__probe = { calls: [], pushes: [], sends: [], listeners: {} };
          // Desktop bridge: enough for the panel to believe it runs inside the shell.
          window.__TAURI__ = {
            core: { invoke: async (command, args) => {
              window.__probe.calls.push(command);
              if (command === 'bubble_environment') {
                return { api_base: 'http://probe.invalid/dsh-bubble', token: 'probe', locale: 'zh', ball_size: 72 };
              }
              // Failure injection: a refused focus command must surface an error, never a silent no-op.
              if (command === 'bubble_focus_main' && window.__probe.failFocus === true) {
                throw new Error('系统拒绝了窗口激活');
              }
              // Geometry changes take real time; the delay models the window resize so the probe can
              // inspect what the panel shows while a resize is in flight.
              if (command === 'bubble_set_expanded') {
                const state = {
                  ball: { x: 1635, y: 492 },
                  direction: args?.expanded === true
                    ? { horizontal: 'left', vertical: 'up' }
                    : { horizontal: 'right', vertical: 'down' },
                  expanded: args?.expanded === true,
                  docked: null,
                };
                window.__probe.geometryPending = true;
                await new Promise((resolve) => setTimeout(resolve, 200));
                window.__probe.geometryPending = false;
                return state;
              }
              return null;
            } },
            event: { listen: async () => () => {} },
          };
          // Network: canned snapshot plus a controllable event stream.
          window.fetch = async (url, options) => {
            const target = String(url);
            if (target.includes('/message')) {
              window.__probe.sends.push(JSON.parse(options?.body ?? '{}').text);
            }
            const body = target.includes('/state') ? JSON.stringify({ messages: [] }) : '{}';
            return new Response(body, { status: 200, headers: { 'content-type': 'application/json' } });
          };
          window.EventSource = class {
            constructor() { window.__probe.source = this; this.readyState = 1; }
            addEventListener(type, handler) { window.__probe.listeners[type] = handler; }
            close() {}
          };
          window.__probe.push = (payload) => {
            const handler = window.__probe.listeners.bubble ?? window.__probe.listeners.message;
            window.__probe.pushes.push(payload.type);
            handler?.({ data: JSON.stringify(payload) });
          };
          Element.prototype.setPointerCapture = function () {};
          Element.prototype.releasePointerCapture = function () {};
        <\/script>`
      }

      /** Write the panel page into the iframe with the shim already installed. */
      async function mountPanel(frame) {
        const html = await (await fetch('../index.html')).text()
        const doc = frame.contentDocument
        doc.open()
        doc.write(html.replace('<head>', `<head>${shim()}`))
        doc.close()
        return doc
      }

      /** Fire a synthetic pointer event on a target inside the panel document. */
      function pointer(win, target, type, x, y) {
        target.dispatchEvent(new win.PointerEvent(type, {
          bubbles: true, cancelable: true, composed: true,
          button: 0, buttons: type === 'pointerdown' ? 1 : 0, pointerId: 1,
          clientX: x, clientY: y, screenX: x, screenY: y,
        }))
      }

      /** One text message in the shape the host publishes. */
      const message = (id, role, text) => ({ id, role, text })

      async function main() {
        const frame = document.getElementById('frame')
        const doc = await mountPanel(frame)
        const win = frame.contentWindow
        /**
         * Wait until the panel's stylesheets have been applied.
         *
         * Over HTTP the styles arrive after the markup; without this gate a measurement can run against
         * an unstyled page and report a layout bug that does not exist. The probe checks a custom
         * property that only the stylesheet defines, because the panel itself is collapsed (and so has
         * no size at all) until the ball is clicked.
         */
        const waitForStyles = async (timeoutMs = 8000) => {
          const started = Date.now()
          while (Date.now() - started < timeoutMs) {
            const chrome = win.getComputedStyle(doc.documentElement).getPropertyValue('--chrome').trim()
            if (chrome !== '') return { chrome, sheets: doc.styleSheets.length }
            await sleep(100)
          }
          return undefined
        }
        await sleep(200)
        const probe = win.__probe
        const failures = []
        const transcript = doc.getElementById('transcript')
        const bubble = doc.getElementById('ball')
        const prompt = doc.getElementById('prompt')
        const jumpLatest = doc.getElementById('jump-latest')
        const statusLine = doc.getElementById('status')
        const questionCard = doc.getElementById('question-card')

        /** Record one assertion. */
        const check = (name, ok, detail) => {
          say(`${ok ? 'ok  ' : 'FAIL'} ${name}${detail === undefined ? '' : ` (${detail})`}`)
          if (!ok) failures.push(name)
        }

        /**
         * Wait for a condition instead of a fixed delay.
         *
         * The panel's state changes are asynchronous (the window geometry call takes real time), so a
         * fixed sleep races the state machine and reports product bugs that are not there.
         *
         * @param predicate - Condition to poll.
         * @param timeoutMs - Give up after this long.
         * @returns True when the condition held before the timeout.
         */
        const waitFor = async (predicate, timeoutMs = 5000) => {
          const started = Date.now()
          while (Date.now() - started < timeoutMs) {
            if (predicate()) return true
            await sleep(25)
          }
          return false
        }

        check('panel mounted', typeof probe?.push === 'function', `calls=${probe?.calls?.join(',') ?? 'none'}`)
        const styles = await waitForStyles()
        check('样式已加载', styles !== undefined,
          styles === undefined ? 'stylesheet never applied' : `--chrome=${styles.chrome} sheets=${styles.sheets}`)
        if (styles === undefined) {
          out.dataset.result = 'fail'
          say('FAIL: 面板样式未加载，后续布局断言无意义')
          return
        }
        // Diagnostics: which sheets actually arrived, and how the panel is laid out.
        for (const sheet of doc.styleSheets) {
          let rules = -1
          try {
            rules = sheet.cssRules.length
          } catch {
            rules = -1
          }
          say(`sheet ${sheet.href ?? '(inline)'} rules=${rules}`)
        }
        const panelStyle = win.getComputedStyle(doc.getElementById('panel'))
        say(`panel style: position=${panelStyle.position} inset=${panelStyle.inset} `
          + `bodyHeight=${win.getComputedStyle(doc.body).height} htmlHeight=${win.getComputedStyle(doc.documentElement).height}`)

        // Expand the panel through the real ball click handler.
        pointer(win, bubble, 'pointerdown', 40, 40)
        pointer(win, bubble, 'pointerup', 40, 40)
        await sleep(400)
        check('expanded', doc.body.classList.contains('expanded'))

        // A transcript long enough to scroll.
        const long = '这一段用来把对话视窗撑出滚动条，重复若干次以便产生足够的可滚动高度。'
        const seeded = []
        for (let index = 0; index < 14; index += 1) {
          seeded.push(message(`m${index}`, index % 2 === 0 ? 'user' : 'assistant', `${long}${index}`))
        }
        probe.push({ type: 'replace', messages: seeded })
        await sleep(300)
        const scrollable = transcript.scrollHeight > transcript.clientHeight + 40
        check('transcript scrollable', scrollable, `h=${transcript.scrollHeight} v=${transcript.clientHeight}`)

        // --- 1. Reading history must not be yanked away by streaming deltas ...
        transcript.scrollTop = 0
        await sleep(120)
        probe.push({ type: 'delta', id: 'bubble-stream', kind: 'text', text: '流式内容' })
        await sleep(300)
        const stayedUp = transcript.scrollTop < 40
        check('scrolled-away reader is not yanked by a delta', stayedUp, `top=${Math.round(transcript.scrollTop)}`)
        check('“有新消息”提示出现', jumpLatest.hidden === false,
          `hidden=${jumpLatest.hidden} streamRow=${transcript.querySelector('[data-id="bubble-stream"]') !== null} `
          + `rows=${transcript.querySelectorAll('.row').length} top=${Math.round(transcript.scrollTop)}`)

        // --- ... but a new message always jumps to the tail.
        probe.push({ type: 'replace', messages: [...seeded, message('m14', 'assistant', '这是刚收到的新消息。')] })
        await sleep(400)
        const atBottom = transcript.scrollHeight - transcript.scrollTop - transcript.clientHeight <= 4
        check('new message jumps to the tail', atBottom,
          `gap=${Math.round(transcript.scrollHeight - transcript.scrollTop - transcript.clientHeight)}`)
        check('提示随后隐藏', jumpLatest.hidden === true)

        // --- 2. A prompt sent while the agent is busy is echoed immediately.
        // Interact only once the panel is settled: a submit that lands during a geometry change reads an
        // empty composer, which made this probe flaky instead of testing the product.
        await waitFor(() => doc.body.classList.contains('expanded') && !doc.body.classList.contains('layout-change'))
        prompt.textContent = '第二条消息：这条必须立刻可见'
        prompt.dispatchEvent(new win.Event('input', { bubbles: true }))
        say(`composer text before submit = ${JSON.stringify(prompt.textContent)}`)
        doc.getElementById('composer').dispatchEvent(new win.Event('submit', { bubbles: true, cancelable: true }))
        // Wait for the echo itself, not for the request: the panel renders the queued echo after the
        // host answers, so waiting on the fetch observes the state before the echo exists.
        const pendingRows = () => [...transcript.querySelectorAll('.row-pending')]
        await waitFor(() => pendingRows().length === 1)
        await sleep(400)
        check('排队消息立刻可见', pendingRows().length === 1, `rows=${pendingRows().length}`)
        check('排队提示文案', pendingRows()[0]?.textContent.includes('等待 Agent 处理') === true)
        check('请求已发出', probe.sends.includes('第二条消息：这条必须立刻可见'), `sends=${JSON.stringify(probe.sends)}`)

        // Once the durable transcript carries it, the echo retires.
        probe.push({
          type: 'replace',
          messages: [...seeded, message('m15', 'user', '第二条消息：这条必须立刻可见')],
        })
        await sleep(300)
        check('落地后撤销回显', pendingRows().length === 0, `rows=${pendingRows().length}`)
        check('真实消息已渲染', transcript.textContent.includes('第二条消息：这条必须立刻可见'))

        // --- 3. A pending question is surfaced with its options and a jump button.
        probe.push({
          type: 'question',
          question: {
            callId: 'call-1',
            questions: [{
              id: 'deploy',
              header: '确认',
              question: '要部署到生产环境吗？',
              options: [{ label: '是' }, { label: '否' }],
            }],
          },
        })
        await sleep(300)
        check('提问卡片出现', questionCard.hidden === false)
        check('问题正文渲染', questionCard.textContent.includes('要部署到生产环境吗？'))
        check('选项渲染', questionCard.querySelectorAll('.question-options li').length === 2)
        check('提问时闪任务栏提醒', probe.calls.includes('bubble_flash_main'), `calls=${probe.calls.join(',')}`)

        const before = probe.calls.length
        doc.getElementById('question-jump').click()
        await sleep(300)
        check('跳转按钮调用 bubble_focus_main',
          probe.calls.slice(before).includes('bubble_focus_main'), `calls=${probe.calls.join(',')}`)
        check('成功后给出提示', statusLine.textContent.includes('已切到 DSH 主窗口'))

        // A refused activation must be reported in the panel, not swallowed.
        probe.failFocus = true
        doc.getElementById('question-jump').click()
        await sleep(400)
        check('激活失败时显示原因',
          statusLine.textContent.includes('无法激活 DSH 主窗口') && statusLine.textContent.includes('系统拒绝了窗口激活'),
          `status=${JSON.stringify(statusLine.textContent)}`)
        check('失败时按钮文案改变',
          doc.getElementById('question-jump').textContent.includes('激活失败'))
        probe.failFocus = false

        // A resolved question clears the card.
        probe.push({ type: 'question', question: null })
        await sleep(200)
        check('提问解决后卡片隐藏', questionCard.hidden === true)

        // --- 4. A very long question must not push the button or the composer out of the panel.
        const longText = '这是一段很长的提问正文，用来把卡片撑高。'.repeat(12)
        const manyOptions = []
        for (let index = 1; index <= 12; index += 1) {
          manyOptions.push({ label: `选项 ${index}`, description: '附带的说明文字也会占高度' })
        }
        probe.push({
          type: 'question',
          question: {
            callId: 'call-long',
            questions: [
              { id: 'q1', header: '确认', question: longText, options: manyOptions },
              { id: 'q2', header: '补充', question: longText, options: manyOptions },
            ],
          },
        })
        await sleep(400)
        const panelRect = doc.getElementById('panel').getBoundingClientRect()
        const jumpRect = doc.getElementById('question-jump').getBoundingClientRect()
        const composerRect = doc.getElementById('composer').getBoundingClientRect()
        const questionList = doc.getElementById('question-list')
        const inside = (rect) => rect.top >= panelRect.top - 1 && rect.bottom <= panelRect.bottom + 1
        check('超长提问时跳转按钮仍在面板内', inside(jumpRect),
          `btn=${Math.round(jumpRect.top)}..${Math.round(jumpRect.bottom)} panel=${Math.round(panelRect.top)}..${Math.round(panelRect.bottom)}`)
        check('超长提问时输入框仍在面板内', inside(composerRect),
          `composer=${Math.round(composerRect.top)}..${Math.round(composerRect.bottom)}`)
        check('超长提问时对话区仍可见', transcript.getBoundingClientRect().height > 24,
          `h=${Math.round(transcript.getBoundingClientRect().height)}`)
        check('问答列表可内部滚动', questionList.scrollHeight > questionList.clientHeight + 4,
          `scroll=${questionList.scrollHeight} client=${questionList.clientHeight}`)
        check('卡片不会超出手面板高度', questionCard.getBoundingClientRect().height <= panelRect.height * 0.5,
          `card=${Math.round(questionCard.getBoundingClientRect().height)} panel=${Math.round(panelRect.height)}`)
        probe.push({ type: 'question', question: null })

        // --- 5. No frame may show the ball mispositioned while the window geometry changes.
        //
        // The ball's default position is the window's top-left corner and its docked corner only comes
        // from the classes the shell's snapshot supplies, so the window resizes before the corner is
        // correct. The panel therefore hides the ball and panel for exactly those frames; this probe
        // samples visibility while the geometry call is still in flight, which is the moment that used
        // to show a flash in the top-left.
        const ballVisibility = () => win.getComputedStyle(bubble).visibility
        check('空闲时球可见（锁没有残留）', ballVisibility() === 'visible', `visibility=${ballVisibility()}`)

        // Collapse hard through the real close button, sampling mid-flight.
        doc.getElementById('close-panel-btn').click()
        await sleep(50)
        const collapseHidden = ballVisibility() === 'hidden'
        const collapseBusy = probe.geometryPending === true
        check('收起过程中球被隐藏', collapseHidden, `visibility=${ballVisibility()} busy=${collapseBusy}`)
        await sleep(300)
        check('收起结束后球重新可见', ballVisibility() === 'visible', `visibility=${ballVisibility()}`)
        check('收起后方向类已更新',
          doc.body.classList.contains('expand-right') && doc.body.classList.contains('expand-down'),
          `body=${doc.body.className}`)

        // Expand again through the real ball click, sampling mid-flight.
        pointer(win, bubble, 'pointerdown', 40, 40)
        pointer(win, bubble, 'pointerup', 40, 40)
        await sleep(50)
        check('展开过程中球被隐藏', ballVisibility() === 'hidden', `visibility=${ballVisibility()}`)
        await sleep(300)
        check('展开结束后球可见', ballVisibility() === 'visible', `visibility=${ballVisibility()}`)
        check('展开后方向类已更新',
          doc.body.classList.contains('expand-left') && doc.body.classList.contains('expand-up'),
          `body=${doc.body.className}`)
        check('展开后球贴在左下角',
          win.getComputedStyle(bubble).right !== 'auto' || win.getComputedStyle(bubble).left === 'auto',
          `left=${win.getComputedStyle(bubble).left} right=${win.getComputedStyle(bubble).right} ` +
          `top=${win.getComputedStyle(bubble).top} bottom=${win.getComputedStyle(bubble).bottom}`)

        say(`pushes=${probe.pushes.join(',')}`)
        out.dataset.result = failures.length === 0 ? 'pass' : 'fail'
        say(`result = ${out.dataset.result}`)
      }

      main().catch((error) => {
        out.dataset.result = 'fail'
        say(`FAIL: ${String(error && error.message ? error.message : error)}`)
      })
    </script>
  </body>
</html>
