<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8">
    <title>Bubble markdown probe</title>
    <link rel="stylesheet" href="../vendor/katex/katex.min.css">
  </head>
  <body>
    <!--
      Rendering probe for the ball's markdown pipeline: loads the real renderer and the real KaTeX in
      a real browser and writes the result into #out. `scripts/check-render.mjs` drives this page
      through headless Edge and asserts on the dumped DOM.
    -->
    <div id="out"></div>
    <script src="../vendor/katex/katex.min.js"></script>
    <script src="../markdown.js"></script>
    <script>
      const source = [
        '# 一级标题',
        '',
        '段落里有 **加粗**、*斜体*、`行内代码`、~~删除线~~ 和链接 [示例](https://example.com)。',
        '',
        '行内公式 $a^2 + b^2 = c^2$ 应该被渲染。',
        '',
        '$$',
        '\\int_0^1 x^2 \\, dx = \\frac{1}{3}',
        '$$',
        '',
        '| 名称 | 值 |',
        '| :--- | ---: |',
        '| 甲 | 1 |',
        '| 乙 | 2 |',
        '',
        '> 引用块',
        '',
        '- [x] 已完成',
        '- [ ] 待办',
        '- 普通项',
        '  - 嵌套项',
        '',
        '```js',
        'const answer = 42',
        '```',
        '',
        '---',
        '',
        '<img src=x onerror=alert(1)>'
      ].join('\n')
      document.getElementById('out').innerHTML = BubbleMarkdown.render(source, {
        math: (tex, display) => katex.renderToString(tex, {
          displayMode: Boolean(display),
          throwOnError: false,
          strict: 'ignore',
        }),
      })
      document.documentElement.dataset.probe = 'done'
    </script>
  </body>
</html>
